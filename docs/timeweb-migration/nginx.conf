events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Larger header buffers for JWT tokens
    proxy_buffer_size          16k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;
    large_client_header_buffers 4 16k;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Certbot ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ----------------------------------------------------------------
        # PostgREST — Supabase-compatible REST API
        # ----------------------------------------------------------------
        location /rest/v1/ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, apikey, x-room-id, x-room-code, x-player-id, X-Client-Info, Prefer, X-Upsert, Range';
                add_header 'Access-Control-Max-Age' '3600';
                return 204;
            }

            # CORS headers for all responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, apikey, x-room-id, x-room-code, x-player-id, X-Client-Info, Prefer, X-Upsert, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Range' always;

            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://postgrest:3000;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  http;
            proxy_set_header Origin             $http_origin;
            proxy_set_header Authorization      $http_authorization;

            proxy_read_timeout  30s;
            proxy_connect_timeout 5s;
        }

        # ----------------------------------------------------------------
        # Health check endpoint
        # ----------------------------------------------------------------
        location = /api/health {
            return 200 '{"ok":true}';
            add_header Content-Type application/json;
        }

        location /health {
            return 200 '{"status":"ok","service":"vecherinkach-api"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------------------
        # Next.js — frontend + API routes
        # ----------------------------------------------------------------
        location / {
            proxy_pass http://nextjs:3000;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  http;

            # WebSocket support (for Next.js HMR / future use)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';

            proxy_read_timeout  60s;
            proxy_connect_timeout 10s;
        }
    }
}
